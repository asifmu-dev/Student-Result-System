<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1 class="site-title">Student Result System</h1>
            <p class="site-sub mb-0">Enter marks, get the result, and keep a record of every student.</p>
        </div>
    </header>

    <main class="container pb-5">
        <section class="row g-4">

            <div class="col-lg-5">
                <section class="card panel main-card">
                    <h2 class="panel-title">New result</h2>

                    <form id="resultForm" novalidate>
                        <div class="mb-4">
                            <label for="studentName" class="form-label">Student name</label>
                            <input type="text" id="studentName" class="form-control" placeholder="e.g. Asif"
                                autocomplete="off">
                        </div>

                        <fieldset class="marks-set mb-4">
                            <legend class="marks-legend">Subject marks</legend>

                            <div class="mark-row">
                                <label for="english" class="mark-label">English</label>
                                <div class="input-group">
                                    <input type="number" id="english" class="form-control" min="0" max="100"
                                        inputmode="numeric" placeholder="0">
                                    <span class="input-group-text">/ 100</span>
                                </div>
                            </div>

                            <div class="mark-row">
                                <label for="math" class="mark-label">Math</label>
                                <div class="input-group">
                                    <input type="number" id="math" class="form-control" min="0" max="100"
                                        inputmode="numeric" placeholder="0">
                                    <span class="input-group-text">/ 100</span>
                                </div>
                            </div>

                            <div class="mark-row">
                                <label for="computer" class="mark-label">Computer</label>
                                <div class="input-group">
                                    <input type="number" id="computer" class="form-control" min="0" max="100"
                                        inputmode="numeric" placeholder="0">
                                    <span class="input-group-text">/ 100</span>
                                </div>
                            </div>
                        </fieldset>

                        <button type="submit" class="btn btn-primary w-100">
                            Calculate result
                        </button>
                    </form>

                    <div id="result" class="mt-4"></div>
                </section>
            </div>

            <div class="col-lg-7">
                <section class="card panel">
                    <h2 class="panel-title">Saved results</h2>
                    <div id="savedResults">
                        <p class="empty-note mb-0">No results saved yet. Calculate a result and it will appear here.</p>
                    </div>
                </section>
            </div>

        </section>
    </main>

    <script src="assets/js/script.js"></script>
</body>

</html>
